<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Реєстрація - Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
                <li class="nav-item" sec:authorize="!hasRole('ADMIN')">
                    <a class="nav-link" href="/analytics">Аналітика</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" href="/users">Користувачі (Admin)</a>
                </li>
            </ul>
            <div sec:authorize="isAuthenticated()" class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button"
                        id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <span th:if="${#authentication.principal.class.simpleName == 'User'}"
                          th:text="${#authentication.name}" class="me-1">Користувач</span>
                    <span th:unless="${#authentication.principal.class.simpleName == 'User'}"
                          th:text="${#authentication.principal.user.name}" class="me-1">Користувач</span>
                    <span sec:authorize="hasRole('PREMIUM')" title="Premium" style="font-size: 0.9em;">⭐</span>
                    <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger ms-1"
                          style="font-size: 0.7em;">ADMIN</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                    <li><a class="dropdown-item" href="/profile">Профіль</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger">Вийти</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Реєстрація</h3>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Ім'я</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" name="passwordHash" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Зареєструватися</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="text-decoration-none">Вже є акаунт? Увійти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
