<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати категорію</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow">
        <h3 class="mb-4">Редагувати категорію</h3>
        <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Назва</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" th:field="*{isExpense}">
                <label class="form-check-label">Це витрата?</label>
            </div>

            <button class="btn btn-primary w-100">Оновити</button>
            <a href="/categories" class="btn btn-secondary w-100 mt-2">Скасувати</a>
        </form>
    </div>
</div>
</body>
</html>
