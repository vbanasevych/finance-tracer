<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мої рахунки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DEMO123456"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-DEMO123456');
    </script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
            </ul>
            <div class="d-flex">
                <a class="btn btn-success" href="/transactions/new">+ Нова витрата</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Мої рахунки</h2>
        <a href="/accounts/new" class="btn btn-primary">Додати рахунок</a>
    </div>

    <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Назва</th>
            <th>Баланс</th>
            <th>Валюта</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${page.content}">
            <td th:text="${account.name}"></td>
            <td th:text="${account.balance}"></td>
            <td th:text="${account.currency}"></td>
            <td>
                <a th:href="@{/accounts/edit/{id}(id=${account.id})}" class="btn btn-sm btn-warning">Редагувати</a>
                <form th:action="@{/accounts/delete/{id}(id=${account.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="/" class="btn btn-secondary">На головну</a>
        <nav>
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{''(page=${page.number - 1})}">Попередня</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages > 0 ? page.totalPages - 1 : 0)}"
                    th:classappend="${page.number == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{''(page=${i})}" th:text="${i + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${page.last or page.totalPages == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{''(page=${page.number + 1})}">Наступна</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
