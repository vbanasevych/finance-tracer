<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вхід - Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Вхід у систему</h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Невірний email або пароль.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Ви успішно вийшли з системи.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success">
                        Реєстрація успішна! Тепер ви можете увійти.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Увійти</button>
                    </form>
                    <div class="text-center mb-3 text-muted">АБО</div>
                    <div class="d-grid gap-2 mb-3">
                       <a href="/oauth2/authorization/google" class="btn btn-outline-danger">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20" class="me-2">
                            Увійти через Google
                        </a>
                    </div>

                    <div class="text-center mt-3">
                        <a th:href="@{/register}" class="text-decoration-none">Немає акаунту? Зареєструватися</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
