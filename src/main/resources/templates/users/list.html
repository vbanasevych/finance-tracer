<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Користувачі - Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
                <li class="nav-item" sec:authorize="!hasRole('ADMIN')">
                    <a class="nav-link" href="/analytics">Аналітика</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" href="/users">Користувачі (Admin)</a>
                </li>
            </ul>
            <div sec:authorize="isAuthenticated()" class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button"
                        id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <span th:if="${#authentication.principal.class.simpleName == 'User'}"
                          th:text="${#authentication.name}" class="me-1">Користувач</span>
                    <span th:unless="${#authentication.principal.class.simpleName == 'User'}"
                          th:text="${#authentication.principal.user.name}" class="me-1">Користувач</span>
                    <span sec:authorize="hasRole('PREMIUM')" title="Premium" style="font-size: 0.9em;">⭐</span>
                    <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger ms-1"
                          style="font-size: 0.7em;">ADMIN</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                    <li><a class="dropdown-item" href="/profile">Профіль</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger">Вийти</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Адмін-панель: Керування користувачами</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Ім'я</th>
                    <th>Email</th>
                    <th>Поточна роль</th>
                    <th>Керування роллю</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.name}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <!-- Красиві бейджі статусу -->
                        <span th:if="${u.role.name() == 'ROLE_ADMIN'}" class="badge bg-danger">Адмін</span>
                        <span th:if="${u.role.name() == 'ROLE_PREMIUM'}" class="badge bg-warning text-dark">Преміум</span>
                        <span th:if="${u.role.name() == 'ROLE_USER'}" class="badge bg-secondary">Користувач</span>
                    </td>
                    <td>
                        <!-- Захист: Адмін не може змінити роль сам собі (перевірка по email) -->
                        <form th:if="${u.email != #authentication.principal.username}"
                              th:action="@{/users/{id}/role(id=${u.id})}" method="post" class="d-flex w-75">

                            <select name="role" class="form-select form-select-sm me-2">
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r.name()}"
                                        th:selected="${r == u.role}"></option>
                            </select>
                            <button type="submit" class="btn btn-success btn-sm">Зберегти</button>

                        </form>
                        <span th:if="${u.email == #authentication.principal.username}" class="text-muted small">
                            Ваш акаунт
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
