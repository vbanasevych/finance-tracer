<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профіль користувача - FinanceTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Особистий кабінет</h4>
                </div>
                <div class="card-body">
                    <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                    <p><strong>Ім'я:</strong> <span th:text="${user.name}"></span></p>
                    <p><strong>Роль:</strong> <span th:text="${user.role}"></span></p>

                    <hr>

                    <h5 class="mt-4">Інтеграція з Telegram</h5>

                    <!-- Якщо Telegram ще не підключено -->
                    <div th:if="${user.telegramChatId == null}">
                        <p class="text-muted">Telegram-бот не підключено до вашого акаунта.</p>

                        <div th:if="${user.telegramVerificationToken == null}">
                            <form th:action="@{/profile/generate-telegram-link}" method="post">
                                <button type="submit" class="btn btn-outline-primary">Згенерувати код для підключення</button>
                            </form>
                        </div>

                        <div th:unless="${user.telegramVerificationToken == null}" class="alert alert-info mt-3">
                            <p class="mb-1">Ваш одноразовий код:</p>
                            <h3 class="text-danger fw-bold" th:text="${user.telegramVerificationToken}"></h3>
                            <p class="mb-0 mt-2">1. Перейдіть до бота: <a href="https://t.me/finance_tracker2026Bot" target="_blank">@finance_tracker2026Bot</a></p>
                            <p class="mb-0">2. Надішліть йому команду:</p>
                            <code>/link <span th:text="${user.telegramVerificationToken}"></span></code>
                        </div>
                    </div>

                    <div th:unless="${user.telegramChatId == null}" class="alert alert-success">
                        <p class="mb-0">✅ Ваш Telegram успішно підключено!</p>
                        <small class="text-muted">Chat ID: <span th:text="${user.telegramChatId}"></span></small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
