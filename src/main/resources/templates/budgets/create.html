<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head><title>Новий бюджет</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
            </ul>
            <div class="d-flex">
                <a class="btn btn-success" href="/transactions/new">+ Нова витрата</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow">
        <h3>Встановити бюджет</h3>
        <form th:action="@{/budgets}" th:object="${budget}" method="post">
            <div class="mb-3">
                <label>Сума ліміту</label>
                <input type="number" step="0.01" class="form-control" th:field="*{limitAmount}" required>
            </div>
            <div class="mb-3">
                <label>Місяць (оберіть 1-ше число)</label>
                <input type="date" class="form-control" th:field="*{month}" required>
            </div>
            <div class="mb-3">
                <label>Категорія</label>
                <select class="form-select" th:field="*{category.id}">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <button class="btn btn-primary w-100">Зберегти</button>
            <a href="/budgets" class="btn btn-secondary w-100 mt-2">Скасувати</a>
        </form>
    </div>
</div>
</body>
</html>
