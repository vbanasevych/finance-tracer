<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати транзакцію</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h3 class="mb-4">Редагувати транзакцію</h3>

        <form th:action="@{/transactions/update/{id}(id=${transactionId})}" th:object="${transactionDto}" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Сума</label>
                <input type="number" step="0.01" class="form-control" th:field="*{amount}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Дата та час</label>
                <input type="datetime-local" class="form-control" th:field="*{dateTime}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Опис</label>
                <input type="text" class="form-control" th:field="*{description}">
            </div>

            <div class="mb-3">
                <label class="form-label">Рахунок</label>
                <select class="form-select" th:field="*{accountId}" required>
                    <option th:each="acc : ${accounts}" th:value="${acc.id}" th:text="${acc.name} + ' (' + ${acc.balance} + ' ' + ${acc.currency} + ')'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Категорія</label>
                <select class="form-select" th:field="*{categoryId}" required>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name} + (${cat.isExpense} ? ' (Витрата)' : ' (Дохід)')"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Оновити фото чеку (необов'язково)</label>
                <input type="file" class="form-control" name="receiptFile" id="receiptImage" accept="image/*">
            </div>

            <div class="mb-3 text-center" th:if="${currentFileUrl != null}">
                <p class="text-muted small">Поточний чек:</p>
                <img th:src="${currentFileUrl}" class="img-thumbnail" style="max-height: 150px;">
            </div>

            <div class="mb-3 text-center">
                <p id="newReceiptLabel" class="text-muted small mb-1 d-none">Новий чек:</p>
                <img id="receiptPreview" src="#" alt="Нове прев'ю" class="img-thumbnail d-none" style="max-height: 150px; border-color: #0d6efd; border-width: 2px;">
            </div>

            <button type="submit" class="btn btn-primary w-100">Оновити</button>
            <a href="/transactions" class="btn btn-secondary w-100 mt-2">Скасувати</a>
        </form>
    </div>
</div>

<script>
    document.getElementById('receiptImage').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('receiptPreview');
                const labelElement = document.getElementById('newReceiptLabel');

                imgElement.src = e.target.result;

                imgElement.classList.remove('d-none');
                labelElement.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
