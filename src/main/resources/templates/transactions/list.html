<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head><title>Історія транзакцій</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DEMO123456"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-DEMO123456');
    </script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
            </ul>
            <div class="d-flex">
                <a class="btn btn-success" href="/transactions/new">+ Нова витрата</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>Транзакції</h2>
        <a href="/transactions/new" class="btn btn-primary">Додати витрату</a>
    </div>

    <div th:if="${budgetWarnings != null and !budgetWarnings.isEmpty()}" class="alert alert-warning shadow-sm mb-4">
        <h5 class="alert-heading fw-bold text-danger">
            ⚠️ Увага: Перевищення бюджету!
        </h5>
        <ul class="mb-0 mt-2">
            <li th:each="warning : ${budgetWarnings}" th:text="${warning}"></li>
        </ul>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Дата</th>
            <th>Сума</th>
            <th>Категорія</th>
            <th>Рахунок</th>
            <th>Опис</th>
            <th>Чек (AWS)</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${#temporals.format(t.dateTime, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${t.amount}"></td>
            <td th:text="${t.category.name}"></td>
            <td th:text="${t.account.name}"></td>
            <td th:text="${t.description}"></td>
            <td>
                <a th:if="${t.receiptFileUrl != null}" th:href="${t.receiptFileUrl}" target="_blank" class="btn btn-sm btn-info">Переглянути</a>
                <span th:if="${t.receiptFileUrl == null}" class="text-muted">Немає</span>
            </td>
            <td>
                <div class="d-flex gap-1">
                    <a th:href="@{/transactions/edit/{id}(id=${t.id})}" class="btn btn-sm btn-warning">Редагувати</a>
                    <form th:action="@{/transactions/delete/{id}(id=${t.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-danger">Видалити</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">На головну</a>
</div>
</body>
</html>
