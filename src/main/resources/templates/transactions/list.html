<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6T1H25TGB7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-6T1H25TGB7');
    </script>
    <title>Історія транзакцій</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" href="/users">Користувачі (Admin)</a>
                </li>
            </ul>
            <div sec:authorize="isAuthenticated()" class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button"
                        id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <span th:if="${#authentication.principal.class.simpleName == 'User'}"
                          th:text="${#authentication.name}" class="me-1">Користувач</span>
                    <span th:unless="${#authentication.principal.class.simpleName == 'User'}"
                          th:text="${#authentication.principal.user.name}" class="me-1">Користувач</span>
                    <span sec:authorize="hasRole('PREMIUM')" title="Premium" style="font-size: 0.9em;">⭐</span>
                    <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger ms-1"
                          style="font-size: 0.7em;">ADMIN</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger">Вийти</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>Транзакції</h2>
        <a href="/transactions/new" class="btn btn-primary">Додати витрату</a>
    </div>

    <div th:if="${budgetWarnings != null and !budgetWarnings.isEmpty()}" class="alert alert-warning shadow-sm mb-4">
        <h5 class="alert-heading fw-bold text-danger">
            ⚠️ Увага: Перевищення бюджету!
        </h5>
        <ul class="mb-0 mt-2">
            <li th:each="warning : ${budgetWarnings}" th:text="${warning}"></li>
        </ul>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th sec:authorize="hasRole('ADMIN')">Власник</th>
            <th>Дата</th>
            <th>Сума</th>
            <th>Категорія</th>
            <th>Рахунок</th>
            <th>Опис</th>
            <th>Чек (AWS)</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${page.content}">
            <td sec:authorize="hasRole('ADMIN')" th:text="${t.user.name}"></td>
            <td th:text="${#temporals.format(t.dateTime, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${t.amount}"></td>
            <td th:text="${t.category.name}"></td>
            <td th:text="${t.account.name}"></td>
            <td th:text="${t.description}"></td>
            <td>
                <a th:if="${t.receiptFileUrl != null}" th:href="${t.receiptFileUrl}" target="_blank"
                   class="btn btn-sm btn-info">Переглянути</a>
                <span th:if="${t.receiptFileUrl == null}" class="text-muted">Немає</span>
            </td>
            <td>
                <div class="d-flex gap-1">
                    <a th:href="@{/transactions/edit/{id}(id=${t.id})}" class="btn btn-sm btn-warning">Редагувати</a>
                    <form th:action="@{/transactions/delete/{id}(id=${t.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-danger">Видалити</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="/" class="btn btn-secondary">На головну</a>
        <nav>
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{''(page=${page.number - 1})}">Попередня</a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, page.totalPages > 0 ? page.totalPages - 1 : 0)}"
                    th:classappend="${page.number == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{''(page=${i})}" th:text="${i + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${page.last or page.totalPages == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{''(page=${page.number + 1})}">Наступна</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
