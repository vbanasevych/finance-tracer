<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Нова транзакція</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h3 class="mb-4">Додати витрату</h3>

        <div th:if="${param.success}" class="alert alert-success">
            Транзакція успішно збережена з чеком!
        </div>

        <form th:action="@{/transactions}" th:object="${transaction}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Сума</label>
                <input type="number" step="0.01" class="form-control" th:field="*{amount}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Дата та час</label>
                <input type="datetime-local" class="form-control" th:field="*{dateTime}" required>
            </div>

            <!-- ID рахунку та категорії для тесту захардкоджені в value=1, потім тут будуть <select> -->
            <input type="hidden" name="accountId" value="1">
            <input type="hidden" name="categoryId" value="1">

            <div class="mb-3">
                <label class="form-label">Фото чеку</label>
                <input type="file" class="form-control" th:field="*{receiptFile}" id="receiptInput" accept="image/*">
            </div>

            <div class="mb-3 text-center">
                <img id="receiptPreview" src="" alt="Прев'ю чеку" class="img-thumbnail d-none" style="max-height: 200px;">
            </div>

            <button type="submit" class="btn btn-primary w-100">Зберегти</button>
        </form>
    </div>
</div>

<script src="/static/file_script.js"></script>
</body>
</html>
