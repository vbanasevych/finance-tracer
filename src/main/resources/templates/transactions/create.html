<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Нова транзакція</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FinanceTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/transactions">Історія витрат</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts">Рахунки</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Категорії</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Бюджети</a></li>
            </ul>
            <div class="d-flex">
                <a class="btn btn-success" href="/transactions/new">+ Нова витрата</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h3 class="mb-4">Додати витрату</h3>

        <div th:if="${param.success}" class="alert alert-success">
            Транзакція успішно збережена!
        </div>

        <form th:action="@{/transactions}" th:object="${transaction}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Сума</label>
                <input type="number" step="0.01" class="form-control" th:field="*{amount}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Дата та час</label>
                <input type="datetime-local" class="form-control" th:field="*{dateTime}" id="dateTime" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Рахунок</label>
                <select class="form-select" th:field="*{accountId}" required>
                    <option th:each="acc : ${accounts}" th:value="${acc.id}" th:text="${acc.name} + ' (' + ${acc.balance} + ' ' + ${acc.currency} + ')'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Категорія</label>
                <select class="form-select" th:field="*{categoryId}" required>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name} + (${cat.isExpense} ? ' (Витрата)' : ' (Дохід)')"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Фото чеку</label>
                <input type="file" class="form-control" name="receiptFile" id="receiptImage" accept="image/*">
            </div>

            <div class="mb-3 text-center">
                <img id="receiptPreview" src="#" alt="Прев'ю" class="img-thumbnail d-none" style="max-height: 150px;">
            </div>

            <button type="submit" class="btn btn-primary w-100">Зберегти</button>
            <a href="/transactions" class="btn btn-secondary w-100 mt-2">Скасувати</a>
        </form>
    </div>
</div>

<script>
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('dateTime').max = now.toISOString().slice(0, 16);

    document.getElementById('receiptImage').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('receiptPreview');
                imgElement.src = e.target.result;
                imgElement.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
